name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly drift check — catches rot even when nobody is committing
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm typecheck
      # Must run after build — it starts the *built* Worker. `build` proves the
      # bundle compiles; only this proves it runs. Without it CI happily passes a
      # Worker that throws at module init, which is exactly what happened with
      # the zod 3/4 split. `e2e` below does not cover this: it boots the Vite dev
      # server, never the bundle that `deploy:web` ships.
      - run: pnpm check:boot

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: OpenAPI spec must be committed in sync with the API
        run: |
          pnpm api:spec
          git diff --exit-code docs/api/openapi.json
      - name: README command tables must document every script
        run: pnpm check:docs-sync
      # One fact, two files: the e2e job runs Playwright's container image, and
      # its tag has to name the version installed from package.json. A mismatch
      # fails e2e with "Executable doesn't exist", which reads as a broken test
      # run rather than a stale tag — so it is caught here, by name, instead.
      - name: Playwright container tags must match the pinned version
        run: |
          pinned=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          # Every workflow, not just ci.yml — release.yml runs the same image,
          # and a tag that drifted only there would surface for the first time
          # during a release, which is the worst moment to learn it.
          tags=$(sed -n 's|.*mcr\.microsoft\.com/playwright:v\([0-9][0-9.]*\)-.*|\1|p' .github/workflows/*.yml | sort -u)
          if [ -z "$tags" ]; then
            echo "::error::no Playwright container image found in .github/workflows/"
            exit 1
          fi
          for tagged in $tags; do
            if [ "$pinned" != "$tagged" ]; then
              echo "::error::package.json pins @playwright/test $pinned but a workflow runs the v$tagged image"
              exit 1
            fi
          done
          echo "Playwright $pinned matches every container image tag"

  e2e:
    runs-on: ubuntu-latest
    # Playwright's own image, which already carries Chromium *and* the OS
    # libraries it links against — so this job never runs `apt-get`.
    #
    # It used to. `playwright install --with-deps` shells out to
    # `apt-get update && install` on every run, and the runner's local mirror
    # (azure.archive.ubuntu.com) intermittently goes unreachable: apt then falls
    # back to archive.ubuntu.com and crawls. Measured across five *green* runs,
    # that one step took 26s, 28s, 205s, 426s and 1368s — a 50x spread on a step
    # that installs the same bytes every time, and no way to tell a slow run from
    # a wedged one while it is happening.
    #
    # `--user 1001` matches the runner's own uid, which owns the checkout;
    # without it the container writes as root and later steps hit EACCES.
    #
    # **The tag must match the `@playwright/test` version in package.json** —
    # Playwright refuses a browser build it did not expect, so a drifted tag is a
    # hard failure rather than a silent wrong-browser run. That is why the
    # devDependency is pinned exactly rather than to `^1`, and why the `drift`
    # job above asserts the two agree.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    # The container makes a hang unlikely, not impossible, and this job inherits
    # GitHub's 6-hour default otherwise. Thirty minutes is roughly 6x the honest
    # runtime (e2e itself is ~4 minutes) — long enough to absorb a slow install,
    # short enough that a wedged runner fails the same morning.
    timeout-minutes: 30
    # A container job defaults `run` to `sh`, not `bash` — the runner falls back
    # when it resolves the shell inside the image, and Ubuntu's `/bin/sh` is
    # dash. Nothing in this job needs bash today, which is luck rather than
    # design: the next step to use `pipefail`, `<<<` or `[[` would fail with an
    # error that never mentions containers. Pinned so it cannot.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # **No `cache: pnpm` here, unlike the two jobs above, and that is
      # deliberate.** A container job runs with `HOME=/github/home` rather than
      # the runner's `/home/runner`, so `pnpm store path` resolves somewhere the
      # host jobs never wrote — every run logged `pnpm cache is not found`, then
      # spent 27s–2m44s tarring and uploading ~198MB anyway. Worse, the key is
      # just OS+arch+lockfile hash, so that upload *overwrote* the entry
      # `quality` and `drift` legitimately hit, which is why the stored size
      # alternated between 192MB and 198MB.
      #
      # It bought nothing to begin with: `pnpm install --frozen-lockfile` took
      # 8s in this job **with the cache missing**. Caching a 200MB store to save
      # eight seconds is a bad trade even when it works.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # The dev server reads apps/web/.dev.vars, which is gitignored and so
      # absent here. `authMiddleware` validates the env on every request and
      # refuses when it is missing (docs/security-audit.md #3), so without this
      # every request — including the landing page — answers 500.
      #
      # Throwaway values, and they must stay that way: this proves the app runs,
      # not that a deployment is configured. RESEND_API_KEY and EMAIL_FROM are
      # deliberately omitted, because the e2e helper relies on verification mail
      # being logged rather than sent.
      # The MCP Worker is a second deploy unit with its own env, and e2e boots
      # it too — from `organization-lifecycle.spec.ts` itself, for the
      # organization deny paths that only exist on that surface.
      # `mcpEnvSchema` requires
      # BETTER_AUTH_SECRET through `sharedEnvSchema`, and `authFor` validates on
      # every request — so without this the Worker listens, Playwright's port
      # probe calls that a clean boot, and the failure surfaces much later as a
      # 500 on /authorize.
      #
      # **The same secret as the web app, deliberately.** The two Workers share
      # one D1 and one user set; a different secret here would mint sessions the
      # web app rejects, which is not the production shape.
      #
      # SENTRY_DSN is absent here and forced empty for local runs by a `--var`
      # in playwright.config.ts — see the comment there.
      - name: Write throwaway dev vars for the e2e server
        run: |
          cat > apps/web/.dev.vars <<'VARS'
          BETTER_AUTH_SECRET=e2e-throwaway-secret-not-for-any-real-use
          BETTER_AUTH_URL=http://localhost:5173
          VARS
          cat > apps/mcp/.dev.vars <<'VARS'
          BETTER_AUTH_SECRET=e2e-throwaway-secret-not-for-any-real-use
          VARS
      - run: pnpm db:migrate
      - run: pnpm test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
