name: release

# Pushing a `v*` tag is the deploy. Nothing else deploys production, so the
# GitHub Release this creates is a record of a deploy that actually happened,
# was smoke-tested, and reported the tagged version back.
#
#   pnpm version:bump patch     # writes package.json + APP_VERSION
#   git commit -am "chore(release): v0.1.1"
#   git push origin HEAD
#   git tag -a v0.1.1 -m "v0.1.1" && git push origin v0.1.1
#
# Three jobs on three runners, and the split is the security boundary:
#
#   verify   — runs every piece of third-party code (install scripts, eslint
#              plugins, browsers, the test suite) and produces the build. No
#              credentials exist here.
#   deploy   — fresh runner, holds the Cloudflare token. Installs, downloads
#              the build, uploads it. Never builds, never tests.
#   release  — fresh runner, holds the only `contents: write` token, for one
#              step, and never checks the repository out at all.
#
# Step-level `env:` is not a substitute for this. Steps in a job share a
# filesystem, so an earlier step can rewrite package.json, a dependency or the
# wrangler config and change what the credentialed step later executes.
#
# Actions are pinned to commit SHAs rather than tags: a tag is mutable, and the
# jobs below hold production credentials.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  # `queue: single` (the default) keeps one pending run: a third tag pushed
  # while the first is deploying *replaces* the second, so that version is
  # never deployed and never released. `max` queues up to 100 instead.
  #
  # Queue order is still not guaranteed — that is what the two ordering guards
  # below are for, since no concurrency setting can order them.
  queue: max
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # Same image and reasoning as ci.yml's `e2e` job: `pnpm verify` ends in the
    # Playwright suite, and installing browser dependencies with
    # `--with-deps` means `apt-get` against a mirror that intermittently stops
    # answering. On CI that produced a 26s-to-43m37s spread on one step. A
    # release is the worst place to discover it — the tag is already pushed by
    # then, so a hung install blocks the deploy with no way forward but a rerun.
    #
    # The tag is asserted against package.json by ci.yml's `drift` job, which
    # scans every workflow file, so this one cannot drift on its own.
    #
    # Two things this job needs that the image does not carry: `gh` (installed
    # below, since two release guards call it) and a writable bin directory for
    # gitleaks (`--user 1001` is not root, so `/usr/local/bin` is out).
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    timeout-minutes: 40
    # **A container job's default `run` shell is `sh`, not `bash`.** The runner
    # resolves `bash` on the host image but falls back to `sh` inside a
    # container, and Ubuntu's `/bin/sh` is dash — which has neither
    # `set -o pipefail` nor `<<<` here-strings. Both appear in the tag guards
    # below, so without this every release fails on its first guard, and the
    # error (`set: Illegal option -o pipefail`) says nothing about containers.
    # Verified from a real run: the container job logged `shell: sh -e {0}`
    # while the host jobs logged `shell: /usr/bin/bash -e {0}`.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: `pnpm verify` runs `gitleaks git`, which scans the log
          # rather than the worktree, and the ancestry check below needs a merge
          # base. This also fetches every branch, so `origin/main` resolves
          # without a second authenticated fetch.
          fetch-depth: 0
          # Do not leave a reusable git credential in `.git/config`. Everything
          # after this step runs in this workspace, and none of it has any
          # business pushing.
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      # No `cache: pnpm`, for the reason ci.yml's `e2e` job spells out: a
      # container runs with `HOME=/github/home`, so the pnpm store lands
      # somewhere the cache never sees — it misses on restore and then spends
      # half a minute uploading ~198MB regardless. The install is ~8s either way.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile

      # The runner image ships `gh`; this container does not. Installed rather
      # than worked around so the two guards below stay exactly as they were —
      # rewriting a release guard to dodge a missing binary is how a guard
      # quietly stops guarding.
      #
      # Same shape as the gitleaks install: pinned version, checksum verified,
      # extracted somewhere this user can write. Bump the two together — a stale
      # hash fails the download, loudly.
      - name: Install gh
        env:
          GH_CLI_VERSION: 2.97.0
          GH_CLI_SHA256: a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112
        run: |
          archive="$RUNNER_TEMP/gh.tar.gz"
          curl -sSfL --retry 3 \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" \
            -o "$archive"
          echo "${GH_CLI_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" --strip-components=2 \
            "gh_${GH_CLI_VERSION}_linux_amd64/bin/gh"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gh" --version

      # Four guards, all before anything is deployed, because none of these
      # failures is fixable afterwards.
      #
      # The already-released tags come in as arguments, which is what makes this
      # a downgrade guard too: queued tag pushes execute in an order GitHub does
      # not guarantee, so `v1.2.1` can run *after* `v1.2.2`.
      - name: Tag must match APP_VERSION and be the newest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          released=$(gh release list --limit 200 --json tagName --jq '.[].tagName' | tr '\n' ' ')
          # Unquoted on purpose: the list must expand to separate arguments.
          # shellcheck disable=SC2086
          pnpm check:release-version "$GITHUB_REF_NAME" $released

      # The guard above compares against GitHub Releases, which are created
      # *last* — so a run that deployed and then failed its smoke check leaves
      # production ahead of every release. Production itself is the authority,
      # and it is asked here. Allows the deploy when nothing answers: a broken
      # Worker has to stay deployable.
      - name: Production must not already be ahead of this tag
        run: pnpm check:not-downgrade "$GITHUB_REF_NAME"

      # A tag can be pushed from any branch, and it would deploy that branch to
      # production. Only what is on main ships.
      - name: Tag must be on main
        run: |
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::origin/main not fetched — cannot prove $GITHUB_REF_NAME is on main"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME is not an ancestor of main — refusing to deploy"
            exit 1
          fi

      # Re-running a *completed* release would upload a second Cloudflare
      # version while the existing release still names the first. Re-runs of a
      # *failed* run are unaffected: no release exists yet.
      #
      # Fails closed. `gh` exits non-zero for "not found", for an auth failure,
      # for a rate limit and for a GitHub outage alike — treating every non-zero
      # as "no release, go ahead" would deploy during an API incident and only
      # discover the conflict afterwards. Only a definite 404 proceeds.
      - name: Tag must not already be released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" 2>&1); then
            echo "::error::$GITHUB_REF_NAME is already released — cut a new version instead of re-running"
            exit 1
          elif grep -q "HTTP 404" <<<"$out"; then
            echo "No release for $GITHUB_REF_NAME yet — proceeding."
          else
            echo "::error::Could not determine whether $GITHUB_REF_NAME is released: $out"
            exit 1
          fi

      # `pnpm verify` shells out to a `gitleaks` binary. The runner has none:
      # gitleaks.yml uses the action, which scans on its own rather than
      # installing one. Pinned — an unpinned `latest` makes the gate's contents
      # change without a commit.
      #
      # Downloaded to disk and checksummed before extraction, rather than piped
      # into tar. A pipe executes whatever arrives — a compromised release asset
      # or a hijacked redirect would be unpacked into a directory on `PATH`
      # before anything could object.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # From gitleaks_8.30.1_checksums.txt, confirmed against the asset.
          # Bump both together — a stale hash fails the download, loudly.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          # `$RUNNER_TEMP/bin` rather than `/usr/local/bin`: this job runs in a
          # container as uid 1001, which is not root and has no sudo. The
          # directory is already on PATH from the gh step above.
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      # A scanner that finds nothing passes every scan. Pinning a version and
      # checksumming the download prove *which* binary ran, never that it still
      # detects anything — a rule change, a bad build or a config default could
      # leave this gate silently green.
      #
      # The canary is not hypothetical care. gitleaks carries global stopwords,
      # and a token built from one (`abcdefghijklmnopqrstuvwxyz`) is skipped by
      # design — which is what a widely-cited "8.30.1 detects nothing" report
      # turned out to be. A canary the scanner ignores would assert the
      # opposite of what it looks like it asserts, so this string is one the
      # installed binary was confirmed to flag.
      #
      # The token is assembled at run time: a literal here would be a real
      # finding in this repository's own history, since gitleaks.yml scans it.
      - name: Prove gitleaks detects a known secret
        run: |
          canary="$RUNNER_TEMP/gitleaks-canary"
          mkdir -p "$canary"
          prefix='ghp'
          body='0123456789abcdefghijABCDEFGHIJ012345'
          printf 'const t = "%s_%s"\n' "$prefix" "$body" > "$canary/leak.ts"
          if gitleaks dir "$canary" >/dev/null 2>&1; then
            echo "::error::gitleaks did not flag a known test secret — the secret scan proves nothing"
            exit 1
          fi
          echo "Canary detected: the scanner works."

      # `verify` ends in e2e, which boots the dev server against
      # apps/web/.dev.vars — gitignored, so absent here, and authMiddleware
      # refuses every request without it (docs/security-audit.md #3).
      #
      # Throwaway values, and they must stay that way: they prove the app runs,
      # not that a deployment is configured. The deploy job reads none of
      # them — the Worker's real secrets live in Cloudflare and ship through a
      # separate channel from the code.
      - name: Write throwaway dev vars for the e2e server
        run: |
          cat > apps/web/.dev.vars <<'VARS'
          BETTER_AUTH_SECRET=e2e-throwaway-secret-not-for-any-real-use
          BETTER_AUTH_URL=http://localhost:5173
          VARS
      - run: pnpm db:migrate
      - name: Verify
        env:
          CI: "true"
        run: pnpm verify

      # `verify` runs `pnpm build`, so the bundle already exists. Handing it to
      # the deploy job means that job never has to build, which is what keeps
      # build-time dependency code off the runner holding the token.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-build
          path: apps/web/build
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # Cloudflare credentials live on this environment, not on the repository, so
    # only this job can read them. Protect it in Settings → Environments: limit
    # deployment branches and tags to `v*`, and add required reviewers if a
    # release should need a second pair of eyes.
    environment: production
    env:
      # wrangler appends one NDJSON record per action here. Parsing that beats
      # scraping the console: the human-readable output is not a contract.
      #
      # `github.workspace`, not `runner.temp`. The `runner` context is not
      # available in `jobs.<job_id>.env` — only in step-level `env` and `run` —
      # and referencing it there makes the whole file invalid, which GitHub
      # reports as a failed run on *every* push rather than as a syntax error.
      # The workflow then also appears in the Actions list by file path instead
      # of by `name`, which is the visible tell.
      WRANGLER_OUTPUT_FILE_PATH: ${{ github.workspace }}/wrangler-output.ndjson
    outputs:
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # Installs wrangler and its dependencies. Residual, stated plainly: this
      # still executes dependency install scripts on the runner that holds the
      # token. `--ignore-scripts` would close that, and is not enabled because
      # it has not been proven safe for esbuild's and workerd's platform binary
      # resolution — an untested flag on the deploy path is its own risk. What
      # this job does *not* do is build or test, and it starts from a clean
      # runner, so nothing `verify` executed persists into it.
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-build
          path: apps/web/build

      # `deploy:web:ungated` is the second half of `deploy:web` rather than an
      # inline wrangler call, so CI cannot drift from the local deploy path — in
      # particular the `--var ENVIRONMENT:production` override, without which
      # every production Sentry event is tagged `development`.
      #
      # `--message` stamps the release onto the Cloudflare version, so the
      # dashboard and `wrangler deployments list` answer "which release is
      # this?" on their own; without it every version reads `Message: -`, and a
      # token-authenticated deploy also reports `Author: undefined`.
      #
      # No `--` before the flag. pnpm 9 passes a literal `--` straight through,
      # and wrangler then reads everything after it as positional, silently
      # ignoring the flags — a failure that still deploys, just wrongly.
      #
      # This does NOT apply remote D1 migrations. Backward-compatible ones are
      # applied *before* the tag is pushed; see AGENTS.md § Cutting a release.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:web:ungated --message "$GITHUB_REF_NAME ($GITHUB_SHA)"

      # A clean `wrangler deploy` only means the bundle uploaded. A Worker whose
      # secrets were never set deploys fine and 500s on every request, so
      # without this the release would announce a dead deploy. Checks every
      # target, asserts the *version* rather than a 200 (the previous deploy
      # answers 200 too), and retries within a deadline so propagation delay
      # does not read as failure.
      - name: Prove the tagged version is live
        run: pnpm check:deployed "$WRANGLER_OUTPUT_FILE_PATH" "${GITHUB_REF_NAME#v}"

      - name: Compose the release notes
        id: notes
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            pnpm -s release:notes "$WRANGLER_OUTPUT_FILE_PATH"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  # Separate job so the write-scoped token exists for one step in a workspace
  # with no third-party code in it — this job never checks out the repo.
  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `--verify-tag` because the tag push is what got us here: if it is
      # somehow absent, `gh` would invent one from the default branch and the
      # release would name the wrong commit.
      #
      # GITHUB_TOKEN, not the `gh auth token --user` prefix AGENTS.md requires
      # locally — that rule is about which of two logged-in accounts a laptop
      # picks, which has no analogue on a runner.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ needs.deploy.outputs.notes }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --notes "$NOTES"
