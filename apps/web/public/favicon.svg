<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Mirrors the site-header logo: rounded bg-primary square + lucide Cloud.
       Colors track the OS/browser theme via prefers-color-scheme, matching the
       light/dark --primary pairs in app.css (sky-700/sky-50, sky-500/sky-950). -->
  <style>
    .bg { fill: #0369a1; }
    .icon { stroke: #f0f9ff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0ea5e9; }
      .icon { stroke: #082f49; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="8"/>
  <path
    class="icon"
    d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"
    fill="none"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    transform="translate(6 6) scale(0.8333)"
  />
</svg>
