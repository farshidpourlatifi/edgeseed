<!doctype html>
<!--
  Source of truth for docs/assets/social-card.png — the repository's GitHub
  social preview (Settings -> General -> Social preview).

  It lives here because GitHub's upload is one-way: the setting stores the image
  on their CDN and offers no export, so without this file the only way back is
  redrawing the card from scratch.

  Rendering it (Playwright is already a dev dependency; Inter and JetBrains Mono
  must be installed locally, or the type falls back to system-ui):

    node -e '
      const { chromium } = require("@playwright/test");
      (async () => {
        const b = await chromium.launch();
        const p = await b.newPage({ viewport: { width: 1280, height: 640 }, deviceScaleFactor: 2 });
        await p.goto("file://" + process.cwd() + "/docs/assets/social-card.html");
        await p.evaluate(() => document.fonts.ready);
        await p.screenshot({ path: "docs/assets/social-card.png" });
        await b.close();
      })()'
    sips --resampleWidth 1280 docs/assets/social-card.png --out docs/assets/social-card.png

  Rendering at deviceScaleFactor 2 and downsampling is deliberate: it antialiases
  the type far better than a 1x shot, and the 1280x640 result stays well under
  GitHub's 1 MB cap, which a straight 2560x1280 export does not reliably do.

  The 80px padding on .wrap is GitHub's 40pt safe border at this raster. Nothing
  that must survive a crop may sit outside it — LinkedIn and Slack trim toward
  square, and the right edge is what they eat. Add `showsafe` to the body class
  to draw the guide and check by eye after any copy change; only the layered
  plates and the top hairline are meant to cross it.

  Product name and repo URL are baked in as literals, unavoidably — a PNG cannot
  read @starter/config. A downstream clone re-renders this file after
  `init:product`, or deletes both files and uploads its own card. Same footing as
  landing.webp and settings.webp, which are EdgeSeed-branded for the same reason.
-->
<meta charset="utf-8" />
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html,
  body {
    width: 1280px;
    height: 640px;
    overflow: hidden;
  }
  body {
    position: relative;
    background: #09090b;
    color: #fafafa;
    font-family: "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* fine grid, faded out toward the bottom-right */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(255, 255, 255, 0.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-mask-image: radial-gradient(120% 100% at 0% 0%, #000 0%, transparent 70%);
  }
  /* sky glow */
  .glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(680px 460px at 6% -8%, rgba(14, 165, 233, 0.28), transparent 62%),
      radial-gradient(720px 520px at 92% 108%, rgba(56, 189, 248, 0.16), transparent 60%);
  }
  /* hairline top edge */
  .edge {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #0ea5e9, #38bdf8 38%, rgba(56, 189, 248, 0) 78%);
  }

  .wrap {
    position: relative;
    height: 100%;
    /* 80px = GitHub's 40pt repo-card safe border. Nothing that must survive a
       crop goes outside this; only the plates and the top hairline bleed. */
    padding: 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .badge {
    width: 62px;
    height: 62px;
    border-radius: 17px;
    background: linear-gradient(150deg, #38bdf8, #0369a1);
    display: grid;
    place-items: center;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.14) inset,
      0 14px 40px -8px rgba(14, 165, 233, 0.65);
  }
  .name {
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.028em;
  }

  h1 {
    font-size: 64px;
    line-height: 1.06;
    font-weight: 700;
    letter-spacing: -0.038em;
    max-width: 720px;
  }
  h1 .hl {
    background: linear-gradient(96deg, #7dd3fc, #0ea5e9);
    -webkit-background-clip: text;
    color: transparent;
  }
  .sub {
    margin-top: 22px;
    font-size: 21px;
    line-height: 1.45;
    color: #a1a1aa;
    max-width: 640px;
    letter-spacing: -0.008em;
  }
  .sub b {
    color: #e4e4e7;
    font-weight: 600;
  }

  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .chips {
    display: flex;
    gap: 10px;
  }
  .chip {
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.005em;
    color: #d4d4d8;
    padding: 10px 17px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.11);
    background: rgba(255, 255, 255, 0.035);
  }
  .repo {
    display: flex;
    align-items: center;
    gap: 11px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 17px;
    color: #a1a1aa;
    white-space: nowrap;
  }
  .repo svg {
    opacity: 0.85;
  }

  /* layered plates, echoing the Layers brand mark */
  .stack {
    position: absolute;
    right: -60px;
    top: 86px;
    width: 590px;
    height: 450px;
    opacity: 0.95;
  }

  /* Safe-area guide: GitHub's 40pt repo-card border, off unless the body
     carries `showsafe`. Turn it on to check a copy change by eye, and never
     ship a render with it. */
  .safe {
    display: none;
    position: absolute;
    inset: 80px;
    outline: 2px solid #b91c1c;
    background: rgba(185, 28, 28, 0.06);
    z-index: 99;
  }
  body.showsafe .safe {
    display: block;
  }
</style>

<div class="safe"></div>
<div class="grid"></div>
<div class="glow"></div>
<div class="edge"></div>

<svg class="stack" viewBox="0 0 620 470" fill="none">
  <defs>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity=".95" />
      <stop offset="1" stop-color="#0ea5e9" stop-opacity=".15" />
    </linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".55" />
      <stop offset="1" stop-color="#0ea5e9" stop-opacity=".08" />
    </linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".3" />
      <stop offset="1" stop-color="#0ea5e9" stop-opacity=".05" />
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  <!-- glow behind the top plate -->
  <path d="M300 20 560 150 300 280 40 150Z" fill="#0ea5e9" opacity=".22" filter="url(#soft)" />

  <path
    d="M300 250 560 380 300 510 40 380Z"
    fill="url(#p3)"
    stroke="#38bdf8"
    stroke-opacity=".35"
    stroke-width="2"
  />
  <path
    d="M300 135 560 265 300 395 40 265Z"
    fill="url(#p2)"
    stroke="#38bdf8"
    stroke-opacity=".5"
    stroke-width="2"
  />
  <path
    d="M300 20 560 150 300 280 40 150Z"
    fill="url(#p1)"
    stroke="#7dd3fc"
    stroke-opacity=".9"
    stroke-width="2.5"
  />
</svg>

        />
      </svg>
      github.com/farshidpourlatifi/edgeseed

</div>
